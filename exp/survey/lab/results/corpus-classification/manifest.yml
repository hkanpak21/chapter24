  near-miss-rows.tsv: the 19 works whose tightness and assessment disagree
notes: >
  Every number the paper reports is recomputed from classification.tsv by
  lab/src/check-numbers.py. The file itself is regenerated from the wiki front
  matter by lab/src/collect-cls.py, so the wiki page is the authority and this
  file is a projection of it.
