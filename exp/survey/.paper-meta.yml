# Survey metadata. Set before the prose, per the research skill's conventions.
title: "How Hard Is the Attack? A Complexity-Theoretic Systematization of Machine Learning Security"
venue:
  name: IEEE S&P (Oakland)
  track: Systematization of Knowledge
  tier: A
  why: >
    The flagship security venue with an explicit SoK category, which is what this
    paper is. It runs four submission cycles a year, so a deadline is never far,
    and it has a major-revision path rather than a single accept-or-reject. The
    corpus's own closest works are there, including the membership-inference
    attack this survey uses as its worked case (S&P 2022) and proof-of-learning
    (S&P 2021). Papernot et al., the systematization this work positions against,
    appeared at IEEE EuroS&P, so the flagship is the natural place for a successor.
  alternatives_considered:
    - USENIX Security SoK, where the field-wide evaluation critique this survey
      leans on was published. A close second.
    - ACM CCS and NDSS, both with SoK tracks, neither a better fit.
    - PoPETs, too privacy-specific for a corpus that is half cryptography.
    - CRYPTO, EUROCRYPT and TCC, which have no systematization track.
  deadline: >
    NOT RECORDED ON PURPOSE. The venues reference warns that every cycle month in
    it is approximate. Check the live call for papers before planning around any
    date.
format:
  class: IEEEtran
  options: conference
  columns: 2
  bibliography: IEEEtran
  # Measured from the compiled document, not assumed.
  column_width_pt: 252.0
  text_width_pt: 516.0
  body_pt: 10
  caption_pt: 8
  font_family: Times New Roman
page_budget:
  # From the call for papers, verified 2026-08-27, quoted verbatim:
  #   "Submitted papers may include up to 13 pages of text and up to 5 pages for
  #    references and appendices, totaling no more than 18 pages."
  #   "For SOK papers, the references do not count towards the number of pages."
  limit_text: 13
  limit_appendix: 5
  references_count_against_limit: false   # SoK exemption
  current_text: 8
  headroom: 5
  note: >
    The classification tables are a separate supplementary document rather than an
    appendix, because they run to 18 pages and the appendix allowance is 5. The
    supplement carries its own bibliography built from the same file, so a work's
    number is the same in both documents.
